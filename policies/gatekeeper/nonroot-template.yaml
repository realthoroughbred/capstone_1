apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: team4nonroot
spec:
  crd:
    spec:
      names:
        kind: Team4NonRoot
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package team4nonroot

              violation contains {"msg": msg} if {
                spec := input.review.object.spec
                field := ["containers", "initContainers", "ephemeralContainers"][_]
                container := object.get(spec, field, [])[_]

                pod_context := object.get(spec, "securityContext", {})
                container_context := object.get(container, "securityContext", {})
                pod_uid := object.get(pod_context, "runAsUser", null)
                uid := object.get(container_context, "runAsUser", pod_uid)

                pod_flag := object.get(pod_context, "runAsNonRoot", false)
                flag := object.get(container_context, "runAsNonRoot", pod_flag)

                not allowed_nonroot(uid, flag)

                msg := sprintf(
                  "Container %v must use non-root UID or runAsNonRoot=true",
                  [container.name]
                )
              }

              allowed_nonroot(uid, flag) if {
                uid != null
                uid >= 1
              }

              allowed_nonroot(uid, flag) if {
                uid == null
                flag == true
              }
