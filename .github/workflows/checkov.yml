name: DevSecOps CI
on:
  push:
    branches: ['main', 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/ci-check.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: static-and-unit-evidence
          path: evidence/ci/
          retention-days: 14
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: bash scripts/install-security-tools.sh
      - run: bash scripts/image-security.sh
      - run: bash scripts/local-signature-test.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: image-security-evidence
          path: |
            evidence/image/*.json
            evidence/image/*.txt
            evidence/image/*.sha256
            evidence/local-signature/verify.json
            evidence/local-signature/wrong-key.txt
          retention-days: 14
