name: Terraform Checkov

on:
  push:
    branches:
      - feature/son-eks-security-automation
  pull_request:

permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install checkov==3.3.29

      - name: Scan Terraform
        run: |
          checkov --config-file .checkov.yaml \
            --var-file infra/terraform.tfvars.example
