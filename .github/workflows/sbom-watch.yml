name: Scheduled image-bound SBOM review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: scheduled-sbom-review
  cancel-in-progress: false
jobs:
  watch:
    if: vars.ENABLE_SBOM_WATCH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/sbom-watch-ledger
          key: sbom-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sbom-ledger-
      - run: bash scripts/install-security-tools.sh
      - name: Rescan approved SBOMs without rebuilding images
        run: |
          export PATH="$PWD/.tools/bin:$PATH"
          python scripts/record-command.py --output-dir evidence/sbom-watch-command -- \
            python scripts/sbom-watch-batch.py --output-dir evidence/sbom-watch --state-dir .tools/sbom-watch-ledger
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: .tools/sbom-watch-ledger
          key: sbom-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sbom-review-and-follow-up
          path: evidence/sbom-watch*/
          retention-days: 30
